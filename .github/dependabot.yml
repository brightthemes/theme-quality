# Weekly dependency updates for theme-tools and its quality checks' own dependencies
# (quality/package.json). Test an update on Skeleton before merging it (see the README).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /quality
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Bucharest
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Bucharest
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(actions)"
