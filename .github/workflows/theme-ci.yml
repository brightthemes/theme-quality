# Reusable: build, gscan and zip like a release; the quality checks on a real Ghost;
# and Dependabot's minor and patch updates merged once both pass. A theme calls it from
# its .github/workflows/ci.yml on pull_request, with types opened, synchronize, reopened and
# ready_for_review (see the README).
name: Theme CI
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22.x'
      quality:
        description: Run the quality checks (needs demo/content.json)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # A new push to the pull request cancels the run before it
    concurrency:
      group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      theme: ${{ steps.files.outputs.theme }}
    steps:
      # Whether the pull request changes anything the quality checks see: docs (*.md, LICENSE)
      # and .github/ alone don't
      - name: Changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "theme=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -qvE '(\.md$|^LICENSE|^\.github/)'; then theme=true; else theme=false; fi
          echo "theme=$theme" >> "$GITHUB_OUTPUT"
          echo "Theme files changed: $theme"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run zip

  # Not on drafts (it runs when the pull request is marked ready, with "ready_for_review" in the
  # caller's pull_request types), not when CI fails, and not for docs or workflow changes alone
  quality:
    name: Quality
    needs: ci
    if: inputs.quality && !github.event.pull_request.draft && needs.ci.outputs.theme == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npx theme-tools setup --with-deps

      - name: Resolve the latest Ghost 6
        id: ghost
        run: echo "version=$(npm view ghost@6 version --json | node -p '[].concat(JSON.parse(require("fs").readFileSync(0))).at(-1)')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ghost-theme-tests
          key: ghost-${{ steps.ghost.outputs.version }}

      - run: npx theme-tools quality
        env:
          GHOST_VERSION: ${{ steps.ghost.outputs.version }}

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-results
          path: quality-results
          include-hidden-files: true
          retention-days: 14

  # Majors (and anything that fails CI) stay open for review
  automerge:
    name: Dependabot auto-merge
    needs: [ci, quality]
    if: ${{ !cancelled() && !failure() && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
