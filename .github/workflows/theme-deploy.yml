# Reusable: zips the theme like a release and uploads it to the theme's demo site. A theme
# calls it from its .github/workflows/deploy.yml on push to main, with `secrets: inherit`
# (GHOST_ADMIN_API_URL and GHOST_ADMIN_API_KEY in the theme repo's secrets). Then it sets up the demo
# site: demo/pages.mjs, and demo/routes-demo.yaml when GHOST_STAFF_EMAIL and GHOST_STAFF_PASSWORD are
# set too (Ghost takes routes only from a staff user). See `theme-tools demo` in the README.
name: Theme deploy
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22.x'
    secrets:
      GHOST_ADMIN_API_URL:
        required: true
      GHOST_ADMIN_API_KEY:
        required: true
      GHOST_STAFF_EMAIL:
        required: false
      GHOST_STAFF_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - run: npm ci
      # The demo zip: the theme plus the templates in demo/ that the demo site's routes use. From
      # theme-tools' main, like this workflow, not the version the theme's lockfile pins
      - run: npx --yes --package=github:brightthemes/theme-tools#main theme-tools zip --demo
      - run: echo "NAME=$(jq -r '.name' package.json)" >> $GITHUB_ENV

      - name: Deploy theme
        uses: TryGhost/action-deploy-theme@v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          file: dist/demo/${{ env.NAME }}.zip

      - name: Set up the demo pages and routes
        run: npx --yes --package=github:brightthemes/theme-tools#main theme-tools demo
        env:
          GHOST_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          GHOST_EMAIL: ${{ secrets.GHOST_STAFF_EMAIL }}
          GHOST_PASSWORD: ${{ secrets.GHOST_STAFF_PASSWORD }}
